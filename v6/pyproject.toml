[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-qc"
version = "6.0.0"
description = "Catálogos reproducibles y ejecución de control de calidad"
requires-python = ">=3.10"

[project.optional-dependencies]
api = ["playwright==1.65.2", "PyYAML==6.0.3", "jsonschema==4.26.0"]
web = ["playwright==1.65.2"]
postgres = ["psycopg[binary]>=3.1,<4"]

[project.scripts]
qc = "agentic_qc.launcher:main"
qc-benchmark = "agentic_qc.launcher:benchmark"

[tool.setuptools]
packages = ["agentic_qc"]
package-dir = {agentic_qc = "."}

[tool.setuptools.package-data]
agentic_qc = ["src/*.py", "src/engine/*.py", "templates/*", "evaluate-llm/*.py", "evaluate-llm/*.html", "evaluate-llm/*.md", "requirements-*.txt", "*.md", "pyproject.toml"]
