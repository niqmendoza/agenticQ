<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reporte de QA · $title</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #18222e;
      background: #f3f5f7;
      line-height: 1.5;
      --muted: #475467;
      --border: #d3dae3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1080px; margin: auto; padding: 36px clamp(16px, 4vw, 42px) 56px; }
    header { border-bottom: 2px solid #334c66; padding-bottom: 20px; }
    h1, h2, h3, p { overflow-wrap: anywhere; }
    h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 4vw, 2.55rem); line-height: 1.15; }
    h2 { margin: 0 0 12px; font-size: 1.3rem; }
    h3 { margin: 0; font-size: 1rem; }
    section { margin-top: 24px; }
    p { margin: 0 0 8px; }
    .muted { color: var(--muted); }
    .context { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: 0; }
    .context div { display: flex; flex-wrap: wrap; gap: 0 5px; }
    .context dt { font-weight: 620; }
    .context dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 8px; margin: 14px 0 0; }
    .overview div { background: white; padding: 10px 12px; border: 1px solid var(--border); border-radius: 5px; }
    .overview dt { color: var(--muted); font-size: .86rem; }
    .overview dd { margin: 2px 0 0; font-weight: 650; font-size: 1.3rem; }
    .records { background: white; border: 1px solid var(--border); border-radius: 5px; }
    .record { padding: 14px 16px; min-width: 0; }
    .record + .record { border-top: 1px solid var(--border); }
    .case { display: grid; grid-template-columns: 1fr 1fr 1.15fr; gap: 6px 18px; }
    .case p { margin: 0; }
    .case details { grid-column: 1 / -1; margin-top: 4px; }
    .label { display: block; font-size: .77rem; color: var(--muted); }
    .status { font-weight: 650; }
    .passed { color: #256149; }
    .failed, .invalid_evidence { color: #96342a; }
    .blocked, .partial { color: #754911; }
    .pending { color: var(--muted); }
    summary { cursor: pointer; color: #294b6e; font-size: .88rem; width: fit-content; }
    details ul { margin: 6px 0; padding-inline-start: 22px; }
    li { margin-block: 3px; overflow-wrap: anywhere; }
    .notes { padding-inline-start: 20px; }
    @media (max-width: 650px) {
      main { padding-top: 24px; }
      .case { grid-template-columns: 1fr; gap: 8px; }
    }
    @media print {
      :root { background: white; }
      main { padding: 0; }
      section { margin-top: 16px; }
      .record { break-inside: avoid; }
      details { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Resultados de QA</h1>
      <p><strong>$title</strong></p>
      <dl class="context">
        <div><dt>Corrida</dt><dd>$run</dd></div>
        <div><dt>Entorno</dt><dd>$environment</dd></div>
        <div><dt>Versión</dt><dd>$version</dd></div>
        <div><dt>Inicio</dt><dd>$started</dd></div>
      </dl>
    </header>
    <section aria-labelledby="resumen">
      <h2 id="resumen">Resumen</h2>
      $summary
      <dl class="overview">$counts</dl>
    </section>
    <section aria-labelledby="pruebas">
      <h2 id="pruebas">Casos y resultados</h2>
      $cases
    </section>
    <section aria-labelledby="hallazgos">
      <h2 id="hallazgos">Hallazgos</h2>
      $findings
    </section>
    <section aria-labelledby="pendientes">
      <h2 id="pendientes">Alcance y pendientes</h2>
      $scope
    </section>
  </main>
</body>
</html>
